site_name: FaultScope Documentation
site_description: Noise-aware QEC fault attribution toolkit with a Rust core and Python API
site_url: https://yuguoshao.github.io/FaultScope/
repo_url: https://github.com/yuguoshao/FaultScope
repo_name: yuguoshao/FaultScope
# Keep local file:// builds navigable without relying on directory index lookup.
use_directory_urls: false

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - User Guide: user_guide.md
  - Decoder Development: decoder_development.md
  - API Reference: api_reference.md
  - Theory: theory.md
  - Implementation Overview: implementation_overview.md

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/math.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.highlight
