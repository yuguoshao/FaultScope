site_name: NPSim Documentation
site_description: Rust-core forward noise-aware stabilizer simulator with a Python API
site_url: https://yuguoshao.github.io/NPSim/
repo_url: https://github.com/yuguoshao/NPSim
repo_name: yuguoshao/NPSim
# Keep local file:// builds navigable without relying on directory index lookup.
use_directory_urls: false

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - User Guide: user_guide.md
  - API Reference: api_reference.md
  - Theory: theory.md
  - Implementation Overview: implementation_overview.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
