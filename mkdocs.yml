site_name: FaultScope Documentation
site_description: Stabilizer circuit simulation for quantum error correction with a Rust core and Python API
site_url: https://yuguoshao.github.io/FaultScope/
repo_url: https://github.com/yuguoshao/FaultScope
repo_name: yuguoshao/FaultScope
# Keep local file:// builds navigable without relying on directory index lookup.
use_directory_urls: false
exclude_docs: |
  /superpowers/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Start Here:
      - Getting Started: getting_started.md
      - Guide Overview: user_guide.md
  - Guides:
      - Circuit Sampling: guides/sampling.md
      - Decoding: guides/decoding.md
      - Detector Error Models: guides/dem.md
      - Collection and Thresholds: guides/collection.md
      - Noise Sensitivity: guides/noise_sensitivity.md
  - Reference:
      - API Reference: api_reference.md
      - Native Decoder ABI: native_decoder_abi.md
      - Compatibility: release.md
  - Internals:
      - Architecture: implementation_overview.md
      - Theory: theory.md
  - Development:
      - Decoder Development: decoder_development.md
      - Development and Benchmarks: development.md

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/math.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.highlight
