name: scheduled-benchmarks

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collection-throughput:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade pip maturin
      - run: maturin develop --release
      - run: >-
          python benchmarks/collection_throughput.py
          --shots 100000 --batch-size 10000 --workers 1 2 4
          --json-out collection-throughput.json
      - uses: actions/upload-artifact@v4
        with:
          name: collection-throughput-${{ github.run_id }}
          path: collection-throughput.json
          retention-days: 90
