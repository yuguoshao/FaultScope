name: wheels

on:
  workflow_call:
    inputs:
      source_ref:
        description: Source commit or ref to build
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_17"
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_17"
          - os: macos-15-intel
            target: x86_64
            manylinux: "off"
          - os: macos-14
            target: aarch64
            manylinux: "off"
          - os: windows-latest
            target: x86_64
            manylinux: "off"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist/main
      - name: Install main wheel in a clean environment
        run: >-
          python -c "import glob,subprocess,sys;
          subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall',glob.glob('dist/main/*.whl')[0]])"
      - run: python ${{ github.workspace }}/scripts/wheel_smoke.py
        working-directory: ${{ runner.temp }}
      - run: python -m faultscope.collection --help
        working-directory: ${{ runner.temp }}
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out ../../dist/pymatching
          working-directory: backends/faultscope-pymatching
      - name: Install and smoke-test PyMatching backend
        run: >-
          python -c "import glob,subprocess,sys;
          subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',glob.glob('dist/pymatching/*.whl')[0]])"
      - name: Verify installed PyMatching plugin
        working-directory: ${{ runner.temp }}
        run: python ${{ github.workspace }}/scripts/wheel_smoke.py --pymatching
      - uses: actions/upload-artifact@v4
        with:
          name: faultscope-main-${{ matrix.os }}-${{ matrix.target }}
          path: dist/main/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: faultscope-pymatching-${{ matrix.os }}-${{ matrix.target }}
          path: dist/pymatching/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install maturin twine
      - run: maturin sdist --out dist/main
      - run: maturin sdist --out ../../dist/pymatching
        working-directory: backends/faultscope-pymatching
      - run: python -m twine check dist/main/* dist/pymatching/*
      - uses: actions/upload-artifact@v4
        with:
          name: faultscope-main-sdist
          path: dist/main/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: faultscope-pymatching-sdist
          path: dist/pymatching/*.tar.gz
