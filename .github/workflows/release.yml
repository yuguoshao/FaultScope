name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to build and publish (for example v0.2.11)"
        required: true
        type: string
      publish_registries:
        description: "Publish packages to crates.io and PyPI"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify tag matches workspace version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} does not match the checked-out workspace version: expected v{version}.")
          print(f"Validated release tag {tag}")
          PY

  wheels:
    needs: validate
    uses: ./.github/workflows/wheels.yml
    with:
      source_ref: ${{ needs.validate.outputs.source_ref }}

  draft-release:
    if: github.event_name == 'push'
    needs: wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: faultscope-*
          path: dist
          merge-multiple: true
      - run: >-
          gh release create --repo "${GITHUB_REPOSITORY}"
          "${GITHUB_REF_NAME}" dist/* --draft --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  publish-crates:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_registries }}
    needs: [validate, wheels]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish Rust crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version=$(python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version'])")
          published() {
            curl --fail --silent --show-error --retry 3 "https://index.crates.io/fa/ul/$1" |
              jq --slurp --exit-status --arg version "$version" 'any(.[]; .vers == $version and .yanked == false)' > /dev/null
          }
          if published faultscope-core; then
            echo "faultscope-core ${version} is already published"
          else
            cargo publish -p faultscope-core --locked
          fi
          if published faultscope-collection; then
            echo "faultscope-collection ${version} is already published"
          else
            cargo publish -p faultscope-collection --locked
          fi

  publish-main:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_registries }}
    needs: [publish-crates, wheels]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: faultscope-main-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-pymatching:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_registries }}
    needs: [publish-main, wheels]
    runs-on: ubuntu-latest
    environment: release-pymatching
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: faultscope-pymatching-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
