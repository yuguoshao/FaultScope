name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to build and publish (for example v0.2.11)"
        required: true
        type: string
      publish_registries:
        description: "Publish packages to crates.io and PyPI"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify tag matches workspace version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} does not match the checked-out workspace version: expected v{version}.")
          print(f"Validated release tag {tag}")
          PY

  wheels:
    needs: validate
    uses: ./.github/workflows/wheels.yml
    with:
      source_ref: ${{ needs.validate.outputs.source_ref }}

  draft-release:
    if: github.event_name == 'push'
    needs: wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: faultscope-*
          path: dist
          merge-multiple: true
      - run: >-
          gh release create --repo "${GITHUB_REPOSITORY}"
          "${GITHUB_REF_NAME}" dist/* --draft --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  publish-crates:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_registries }}
    needs: [validate, wheels]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Correct registry keywords in the original v0.2.11 source
        id: crate_metadata
        if: ${{ needs.validate.outputs.source_ref == 'a0351591f7b9c8ab10313d7f2cec16e013b022c8' }}
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          old = 'keywords = ["quantum-error-correction",'
          new = 'keywords = ["quantum", "qec",'
          for name in ("faultscope-core", "faultscope-collection"):
              path = pathlib.Path("crates") / name / "Cargo.toml"
              source = path.read_text()
              if source.count(old) != 1:
                  raise SystemExit(f"Unexpected legacy keywords in {path}")
              updated = source.replace(old, new, 1)
              expected = tomllib.loads(source)
              expected["package"]["keywords"][0:1] = ["quantum", "qec"]
              if tomllib.loads(updated) != expected:
                  raise SystemExit(f"Unexpected metadata change in {path}")
              path.write_text(updated)
              print(f"Corrected registry keywords in {path}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("allow_dirty=--allow-dirty\n")
          PY
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish -p faultscope-core --locked ${{ steps.crate_metadata.outputs.allow_dirty }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for faultscope-core to reach the registry index
        shell: bash
        run: |
          version=$(python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version'])")
          for attempt in {1..30}; do
            if cargo search faultscope-core --limit 1 | grep -F "faultscope-core = \"${version}\""; then
              exit 0
            fi
            sleep 10
          done
          echo "faultscope-core ${version} did not reach the crates.io index" >&2
          exit 1
      - run: cargo publish -p faultscope-collection --locked ${{ steps.crate_metadata.outputs.allow_dirty }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-main:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_registries }}
    needs: [publish-crates, wheels]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: faultscope-main-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-pymatching:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_registries }}
    needs: [publish-main, wheels]
    runs-on: ubuntu-latest
    environment: release-pymatching
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: faultscope-pymatching-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
