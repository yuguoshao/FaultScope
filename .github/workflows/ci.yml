name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo doc -p faultscope-core -p faultscope-collection --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package -p faultscope-core --locked
      - name: Package collection before the first core release
        run: >-
          cargo package -p faultscope-collection --locked --no-verify
          --config 'patch.crates-io.faultscope-core.path="crates/faultscope-core"'

  rust-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85
      - run: cargo check -p faultscope-core -p faultscope-collection --all-features

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --upgrade pip "maturin>=1.7,<2"
      - run: .venv/bin/maturin develop --extras test --locked
      - run: .venv/bin/python -m unittest discover -s tests -q
      - run: .venv/bin/python -m pytest -q

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --upgrade pip "maturin>=1.7,<2"
      - run: .venv/bin/maturin develop --extras test --locked
      - run: >-
          .venv/bin/python -m ruff check faultscope tests benchmarks scripts
          backends/faultscope-pymatching/src backends/faultscope-fusion-blossom/src
      - run: >-
          .venv/bin/python -m ruff format --check faultscope tests benchmarks scripts
          backends/faultscope-pymatching/src backends/faultscope-fusion-blossom/src
      - run: .venv/bin/python -m mypy
      - run: .venv/bin/python scripts/generate_native_stub.py --check
      - run: .venv/bin/python -m mypy.stubtest faultscope._native --ignore-missing-stub

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade pip maturin twine
      - run: maturin build --release --out dist
      - run: maturin sdist --out dist
      - run: python -m twine check dist/*
      - run: python -m venv wheel-venv
      - run: wheel-venv/bin/python -m pip install dist/faultscope-*.whl
      - run: >-
          ${{ github.workspace }}/wheel-venv/bin/python
          ${{ github.workspace }}/scripts/wheel_smoke.py
        working-directory: ${{ runner.temp }}
      - run: ${{ github.workspace }}/wheel-venv/bin/python -m faultscope.collection --help
        working-directory: ${{ runner.temp }}

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: >-
          python benchmarks/collection_throughput.py
          --shots 1000 --batch-size 100 --workers 1 2
          --json-out collection-throughput-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: collection-throughput-smoke
          path: collection-throughput-smoke.json
