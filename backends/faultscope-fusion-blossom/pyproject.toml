[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "faultscope-fusion-blossom"
dynamic = ["version"]
description = "Official FaultScope fusion-blossom native decoder backend"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "FaultScope contributors" }]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
]
dependencies = [
    "faultscope>=0.2.12,<0.3",
]

[tool.maturin]
module-name = "faultscope_fusion_blossom._native"
python-source = "src"

[project.entry-points."faultscope.native_decoders"]
fusion-blossom = "faultscope_fusion_blossom:backend_manifest"
