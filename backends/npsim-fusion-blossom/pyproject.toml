[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "npsim-fusion-blossom"
version = "0.1.0"
description = "Official NPSim fusion-blossom native decoder backend"
requires-python = ">=3.10"
dependencies = [
    "npsim",
]

[tool.maturin]
module-name = "npsim_fusion_blossom._native"
python-source = "src"

[project.entry-points."npsim.native_decoders"]
fusion-blossom = "npsim_fusion_blossom:backend_manifest"
