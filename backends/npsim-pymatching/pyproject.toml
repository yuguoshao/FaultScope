[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "npsim-pymatching"
version = "0.1.0"
description = "Official NPSim PyMatching native decoder backend"
requires-python = ">=3.10"
dependencies = [
    "npsim",
]

[tool.maturin]
module-name = "npsim_pymatching._native"
python-source = "src"

[project.entry-points."npsim.native_decoders"]
pymatching = "npsim_pymatching:backend_manifest"
