[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "faultscope-pymatching"
dynamic = ["version"]
description = "Official FaultScope PyMatching native decoder backend"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "FaultScope contributors" }]
dependencies = [
    "faultscope>=0.2.5,<0.3",
]

[tool.maturin]
module-name = "faultscope_pymatching._native"
python-source = "src"

[project.entry-points."faultscope.native_decoders"]
pymatching = "faultscope_pymatching:backend_manifest"
