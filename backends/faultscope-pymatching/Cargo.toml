[package]
name = "faultscope-pymatching-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Native PyMatching decoder plugin for FaultScope"
publish = false

[lib]
name = "faultscope_pymatching_native"
crate-type = ["cdylib"]
test = false

[dependencies]
faultscope-core = { version = "0.2.0", path = "../../crates/faultscope-core" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }

[build-dependencies]
cc = "1"
