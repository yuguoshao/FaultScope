[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "npsim"
version = "0.1.0"
description = "Forward noise-aware stabilizer trajectory simulator for QEC hotspot studies"
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
pymatching = [
    "numpy",
    "scipy",
    "pymatching",
]
visualization = [
    "pillow",
]
benchmark = [
    "numpy",
    "stim",
]
test = [
    "numpy",
    "scipy",
    "pymatching",
    "stim",
]
native-build = [
    "maturin>=1.7",
]

[tool.setuptools.packages.find]
include = ["npsim*"]
