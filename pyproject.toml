[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "npsim"
version = "0.1.0"
description = "Rust-core forward noise-aware stabilizer simulator with a Python API"
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
pymatching = [
    "numpy",
    "scipy",
    "pymatching",
]
visualization = [
    "pillow",
]
benchmark = [
    "numpy",
    "stim",
]
test = [
    "numpy",
    "scipy",
    "pymatching",
    "stim",
]
native-build = [
    "maturin>=1.7",
]

[tool.maturin]
manifest-path = "crates/npsim-python/Cargo.toml"
module-name = "npsim._npsim_native"
python-source = "."
