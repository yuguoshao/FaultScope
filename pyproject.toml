[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "faultscope"
version = "0.1.0"
description = "Noise-aware QEC fault attribution toolkit with a Rust core and Python API"
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
pymatching = [
    "numpy",
    "scipy",
    "pymatching",
]
visualization = [
    "pillow",
]
benchmark = [
    "numpy",
    "stim",
]
collection = [
    "numpy",
    "scipy",
    "matplotlib",
]
test = [
    "numpy",
    "scipy",
    "matplotlib",
    "pymatching",
    "stim",
]
native-build = [
    "maturin>=1.7",
]

[tool.maturin]
manifest-path = "crates/faultscope-python/Cargo.toml"
module-name = "faultscope._native"
python-source = "."
